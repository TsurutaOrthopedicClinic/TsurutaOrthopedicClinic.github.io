<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年度 個人情報保護研修</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Meiryo","Noto Sans JP",sans-serif;background:#eef3f7;color:#263238}
header{background:#1769aa;color:white;padding:18px 20px;text-align:center}
header h1{margin:0;font-size:24px}
main{max-width:900px;margin:20px auto;padding:0 14px}
.card{background:white;border-radius:14px;padding:24px;box-shadow:0 3px 12px #0001;margin-bottom:18px}
button{border:0;border-radius:10px;padding:13px 20px;font-size:16px;cursor:pointer;background:#1769aa;color:white;margin:5px}
button.secondary{background:#607d8b}
button.success{background:#2e7d32}
button:disabled{background:#b0bec5;cursor:not-allowed}
.hidden{display:none!important}
.center{text-align:center}
#reader{max-width:500px;margin:15px auto}
.staff{font-size:20px;font-weight:bold;padding:12px;background:#e3f2fd;border-radius:10px}
.slide-title{font-size:28px;color:#1769aa;margin:0 0 15px}
.slide-body{font-size:19px;line-height:1.9}
.point{margin-top:20px;padding:15px;background:#fff8e1;border-left:6px solid #ffb300;border-radius:8px;font-size:18px}
.progress-wrap{height:10px;background:#dce4e8;border-radius:10px;overflow:hidden;margin:12px 0 20px}
.progress{height:100%;background:#1769aa;width:0}
.slide-no{text-align:right;color:#607d8b}
.question{font-size:20px;line-height:1.7;font-weight:bold}
.choice{display:block;width:100%;max-width:500px;margin:12px auto;padding:16px;font-size:18px}
.result{font-size:24px;font-weight:bold;padding:20px;border-radius:10px}
.pass{background:#e8f5e9;color:#2e7d32}
.fail{background:#ffebee;color:#c62828}
.ref{font-size:14px;line-height:1.7;color:#455a64}
ul{line-height:1.9}
</style>
</head>
<body>
<header><h1>2026年度 個人情報保護研修</h1></header>

<main>
<section id="home" class="card center">
<h2>受講者確認</h2>
<p>QRコードを読み取って受講を開始してください。</p>
<button onclick="startCamera()">QRコードを読み取る</button>
<button class="secondary" onclick="document.getElementById('qrFile').click()">写真から読み取る</button>
<input id="qrFile" type="file" accept="image/*" class="hidden" onchange="scanFile(this)">
<div id="reader"></div>
<div id="staffArea" class="staff">個人コード：<span id="staffId">未取得</span></div>
<br>
<button id="startBtn" disabled onclick="startTraining()">研修を開始する</button>
</section>

<section id="training" class="card hidden">
<div class="slide-no"><span id="slideNo"></span> / <span id="slideTotal"></span></div>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<h2 id="slideTitle" class="slide-title"></h2>
<div id="slideBody" class="slide-body"></div>
<div id="slidePoint" class="point"></div>
<div class="center">
<button id="prevBtn" class="secondary" onclick="prevSlide()">← 前へ</button>
<button id="nextBtn" onclick="nextSlide()">次へ →</button>
</div>
</section>

<section id="quiz" class="card hidden">
<h2>確認テスト</h2>
<p>全10問です。8問以上正解で合格です。</p>
<div class="progress-wrap"><div id="quizProgress" class="progress"></div></div>
<div id="questionArea"></div>
</section>

<section id="result" class="card hidden center">
<h2>研修結果</h2>
<div id="resultBox" class="result"></div>
<p id="resultDetail"></p>
<button id="sendBtn" class="success" onclick="sendResult()">受講記録を送信する</button>
<p id="sendStatus"></p>
</section>
</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzcdvX23KkXxXGEnXKoFLNNHCKIXGB52HHSMD6x6R7zmtDLjaDuCoYp4AKNRuho6GGmZg/exec";
const TRAINING_YEAR = "2026年度";
const TRAINING_NAME = "個人情報保護研修";

let staffId = "";
let slideIndex = 0;
let quizIndex = 0;
let score = 0;
let qrScanner = null;

const lessons = [
{
 title:"1．医療機関で扱う個人情報",
 body:`<p>医療機関では、氏名・住所・電話番号だけでなく、診療録、検査結果、画像、病歴、診療・調剤に関する情報など、患者さんに関する多くの情報を扱います。</p><p>特に病歴や診療・検査に関する情報などは、慎重な取扱いが必要な情報です。</p>`,
 point:"「これは個人情報ではないだろう」と自己判断せず、患者さんに関する情報は大切に扱いましょう。"
},
{
 title:"2．カルテ・患者情報の閲覧",
 body:`<p>電子カルテや紙カルテは、業務上必要な範囲で利用します。</p><ul><li>担当していない患者さんを興味本位で閲覧しない</li><li>知人・家族・有名人などであっても、業務上必要がなければ閲覧しない</li><li>離席するときは画面をロックする</li></ul>`,
 point:"「見られるから見る」ではなく、「仕事に必要だから見る」が基本です。"
},
{
 title:"3．スマートフォン・写真",
 body:`<p>個人スマートフォンで患者さんの情報を撮影・保存すると、紛失や誤送信などにつながる可能性があります。</p><p>患者氏名が写っていない場合でも、日時・診療内容・画像などの組み合わせから患者さんが特定されることがあります。</p>`,
 point:"患者情報の撮影・保存は、院内のルールと許可された方法に従いましょう。"
},
{
 title:"4．メール・FAX",
 body:`<p>メールやFAXは、送信先を間違えるだけで情報が外部へ出てしまいます。</p><ul><li>宛先・FAX番号を確認する</li><li>添付ファイルの内容・宛先を確認する</li><li>必要以上の患者情報を添付しない</li></ul>`,
 point:"送信前の「ひと呼吸」が、誤送信防止につながります。"
},
{
 title:"5．USB・書類・私物PC",
 body:`<p>患者情報を含むファイルを私物USBや私物PCへコピーして持ち出すことは、院内ルールに反する可能性があります。</p><p>紙の書類も同じです。机の上、コピー機、プリンターなどに患者情報を放置しないよう注意します。</p>`,
 point:"「自分しか使わないから大丈夫」ではなく、許可された機器・保存場所・方法を使います。"
},
{
 title:"6．ID・パスワード",
 body:`<p>電子カルテなどのID・パスワードは本人を識別するための重要な情報です。</p><ul><li>他人に教えない</li><li>他人のIDを借りない</li><li>付箋などに書いて人目につく場所へ貼らない</li></ul>`,
 point:"ID・パスワードの共有は、誰が操作したのか分からなくなる原因にもなります。"
},
{
 title:"7．SNS・メッセージ",
 body:`<p>患者さんの氏名を書いていなくても、写真、年齢、診療日、病名、出来事などの組み合わせで個人が特定される場合があります。</p><p>個人SNSや私的なメッセージサービスへ患者情報を投稿しないようにします。</p>`,
 point:"「名前を書いていない＝匿名」ではありません。"
},
{
 title:"8．個人情報の事故が起きたら",
 body:`<p>誤送信、書類の紛失、USBの紛失、誤った患者情報の閲覧などに気づいたら、自己判断で隠さず、速やかに院内で決められた方法に従って報告します。</p><p>小さな「ヒヤリ・ハット」の段階で共有することも、再発防止につながります。</p>`,
 point:"事故をゼロにするだけでなく、早く気づき、早く報告し、被害拡大を防ぐことが重要です。"
},
{
 title:"9．今日から意識する3つ",
 body:`<p>患者情報を扱うときは、次の3点を意識しましょう。</p><ul><li><b>必要な人</b>が</li><li><b>必要な情報</b>を</li><li><b>必要な目的・方法</b>で扱う</li></ul>`,
 point:"迷ったときは、院内の責任者・個人情報担当者・情報システム担当者などに確認しましょう。"
},
{
 title:"10．参考資料",
 body:`<p>今回の研修内容は、厚生労働省・個人情報保護委員会が公開している医療・介護関係事業者向けの資料等を参考にしています。</p><ul><li>医療・介護関係事業者における個人情報の適切な取扱いのためのガイダンス</li><li>個人情報保護委員会「医療機関における個人情報の取扱いに関する注意喚起」</li><li>個人情報保護委員会「個人情報の研修資料・ヒヤリハット事例」</li></ul>`,
 point:"このスライドを読み終えたら「次へ」を押して、確認テストへ進みます。"
}
];

const questions = [
["診療録や検査結果などは、医療機関で慎重に取り扱う必要がある情報である。","○"],
["業務上必要がなくても、知人のカルテを興味本位で閲覧してよい。","×"],
["患者さんの氏名が写っていなければ、個人スマートフォンでカルテを撮影してよい。","×"],
["FAX送信前には、宛先やFAX番号を確認する。","○"],
["患者情報を含むファイルを私物USBへコピーして持ち帰っても、他人に見せなければ問題ない。","×"],
["ID・パスワードは、同僚から頼まれた場合には教えてよい。","×"],
["患者さんが特定できる情報を個人SNSへ投稿してはいけない。","○"],
["個人情報の誤送信に気づいたら、まず隠して様子を見る。","×"],
["離席時は、第三者にカルテ画面を見られないよう画面をロックする。","○"],
["個人情報に関する事故やヒヤリ・ハットは、院内で決められた方法に従って報告する。","○"]
];

document.getElementById("slideTotal").textContent = lessons.length;

function startCamera(){
  if(qrScanner) return;
  qrScanner = new Html5Qrcode("reader");
  qrScanner.start({facingMode:"environment"},{fps:10,qrbox:250},
    decodedText => {
      setStaff(decodedText);
      qrScanner.stop().then(()=>{qrScanner.clear();qrScanner=null;}).catch(()=>{});
    },
    ()=>{}
  ).catch(err=>alert("カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。"));
}

function scanFile(input){
  if(!input.files || !input.files[0]) return;
  const scanner = new Html5Qrcode("reader");
  scanner.scanFile(input.files[0], true)
    .then(decodedText=>setStaff(decodedText))
    .catch(()=>alert("QRコードを読み取れませんでした。QRコード全体が写った画像を選択してください。"))
    .finally(()=>{try{scanner.clear()}catch(e){}});
}

function setStaff(value){
  const v = String(value).trim();
  if(!/^\d{7}$/.test(v)){
    alert("個人コードを取得できませんでした。7桁のQRコードを確認してください。");
    return;
  }
  staffId=v;
  document.getElementById("staffId").textContent=v;
  document.getElementById("startBtn").disabled=false;
}

function startTraining(){
  if(!staffId){alert("先にQRコードを読み取ってください。");return;}
  document.getElementById("home").classList.add("hidden");
  document.getElementById("training").classList.remove("hidden");
  showSlide();
}

function showSlide(){
  const s=lessons[slideIndex];
  document.getElementById("slideNo").textContent=slideIndex+1;
  document.getElementById("slideTitle").textContent=s.title;
  document.getElementById("slideBody").innerHTML=s.body;
  document.getElementById("slidePoint").innerHTML="<b>ポイント：</b>"+s.point;
  document.getElementById("progress").style.width=((slideIndex+1)/lessons.length*100)+"%";
  document.getElementById("prevBtn").disabled=slideIndex===0;
  document.getElementById("nextBtn").textContent=slideIndex===lessons.length-1?"確認テストへ →":"次へ →";
  window.scrollTo({top:0,behavior:"smooth"});
}

function prevSlide(){if(slideIndex>0){slideIndex--;showSlide();}}
function nextSlide(){
  if(slideIndex<lessons.length-1){slideIndex++;showSlide();}
  else{document.getElementById("training").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");showQuestion();}
}

function showQuestion(){
  const q=questions[quizIndex];
  document.getElementById("quizProgress").style.width=((quizIndex)/questions.length*100)+"%";
  document.getElementById("questionArea").innerHTML=`
    <p>第${quizIndex+1}問 / ${questions.length}問</p>
    <div class="question">${q[0]}</div>
    <div class="center">
      <button class="choice" onclick="answer('○')">○　正しい</button>
      <button class="choice secondary" onclick="answer('×')">×　誤り</button>
    </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function answer(v){
  if(v===questions[quizIndex][1]) score++;
  quizIndex++;
  if(quizIndex<questions.length) showQuestion();
  else showResult();
}

function showResult(){
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  const points=score*10;
  const passed=points>=80;
  document.getElementById("resultBox").className="result "+(passed?"pass":"fail");
  document.getElementById("resultBox").textContent=passed?"合格":"不合格";
  document.getElementById("resultDetail").textContent=`得点：${points}点（10問中 ${score}問正解）`;
  document.getElementById("sendStatus").textContent="";
  window.scrollTo({top:0,behavior:"smooth"});
}

function sendResult(){
  const points=score*10;
  const result=points>=80?"合格":"不合格";
  const btn=document.getElementById("sendBtn");
  btn.disabled=true;
  document.getElementById("sendStatus").textContent="送信中…";
  const params=new URLSearchParams({
    year:TRAINING_YEAR,
    trainingName:TRAINING_NAME,
    staffId:staffId,
    score:String(points),
    result:result
  });
  fetch(GAS_URL,{method:"POST",body:params,mode:"no-cors"})
    .then(()=>{
      document.getElementById("sendStatus").textContent="受講記録を送信しました。";
    })
    .catch(()=>{
      btn.disabled=false;
      document.getElementById("sendStatus").textContent="送信できませんでした。通信環境を確認して再度お試しください。";
    });
}
</script>
</body>
</html>
